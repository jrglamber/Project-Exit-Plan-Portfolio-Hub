name: Metals lane financial review tests
on:
  pull_request:
    paths:
      - 'financial_review.py'
      - 'test_metals_lane_financial_review.py'
      - '.github/workflows/metals-lane-financial-review-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test broker-verified Metals reporting
        run: python -m unittest -v test_metals_lane_financial_review
