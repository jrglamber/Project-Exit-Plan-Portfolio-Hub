name: Hub observer link probe
on:
  push:
    paths: [".github/workflows/hub-observer-link-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare hub observer sources with metals direct
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = [
            ('hub_watchdog','https://project-exit-plan-portfolio-hub-production.up.railway.app/api/ai-observer-watchdog'),
            ('metals_audit','https://metals-production-bb81.up.railway.app/api/ai-observer/status'),
            ('metals_regime','https://metals-production-bb81.up.railway.app/ai-regime-observer/status'),
            ('hub_dashboard','https://project-exit-plan-portfolio-hub-production.up.railway.app/')
          ]
          for label,url in urls:
            try:
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'PEP-status-check'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                raw=resp.read(120000)
                ct=resp.headers.get('content-type')
                print(label,'http',resp.status,'ct',ct)
              if label=='hub_dashboard':
                s=raw.decode('utf-8','replace')
                print('dashboard_observer_widget', 'loadAiObserverWatchdog' in s, 'dashboard_version',s[s.find('Portfolio Hub v'):s.find('Portfolio Hub v')+40])
              else:
                d=json.loads(raw.decode())
                if label=='hub_watchdog': print('hub_state',json.dumps({k:{'state':v.get('state'),'alerts':v.get('alerts'),'reason':v.get('reason'),'capture_age_hours':v.get('capture_age_hours'),'complete_age_hours':v.get('complete_age_hours')} for k,v in (d.get('sources') or {}).items()}))
                elif label=='metals_audit': print('metals_audit',json.dumps({k:d.get(k) for k in ('ok','alerts','capture_age_hours','latest_complete_age_hours','error_count_recent_100','active_ai_error_count','active_ai_errors','overdue_eligible_count')}))
                else: print('metals_regime',json.dumps({k:d.get(k) for k in ('ok','ai_enabled','api_key_configured','thread_alive','counts')},default=str))
            except Exception as e: print(label,'FAIL',type(e).__name__,str(e)[:200])
          PY
