name: AI observer watchdog checks
on:
  pull_request:
    paths:
      - app.py
      - ai_observer_watchdog.py
      - .github/workflows/ai-observer-watchdog-check.yml
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py ai_observer_watchdog.py
