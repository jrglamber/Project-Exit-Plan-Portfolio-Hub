name: One-off Metals live financial and stop health diagnostic
# Final production read-only validation after reconciliation fixes
on:
  push:
    paths: [".github/workflows/metals-health-diagnostic.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public read-only endpoints (no trading controls)
        run: |
          python - <<'PY'
          import json,urllib.request,time,hashlib
          HUB='https://project-exit-plan-portfolio-hub-production.up.railway.app'
          MET='https://metals-production-bb81.up.railway.app'
          def ask(origin,path):
            started=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'Accept':'application/json','User-Agent':'PEP-read-only-diagnostic'}),timeout=18) as resp:
                raw=resp.read(1200000); code=resp.status
              obj=json.loads(raw)
              print('ENDPOINT',path,'HTTP',code,'SECONDS',round(time.monotonic()-started,2))
              return obj
            except Exception as e:
              print('ENDPOINT',path,'ERROR',type(e).__name__,str(e)[:150],'SECONDS',round(time.monotonic()-started,2))
              return {}
          def fields(o,keys):
            if not isinstance(o,dict):return {'invalid_type':str(type(o))}
            return {k:o.get(k) for k in keys if k in o}
          def sig(ids):
            if not isinstance(ids,list):return {'type':str(type(ids))}
            return {'count':len(ids),'hashes':sorted(hashlib.sha256(str(v).encode()).hexdigest()[:9] for v in ids)[:50]}
          a=ask(HUB,'/api/aggregate')
          m=((a.get('sources') or {}).get('metals') or {}).get('data') or {}
          b=m.get('basket') or {}; acc=m.get('accounting') or {}; p=a.get('portfolio') or {}
          print('HUB_SOURCE',fields((a.get('sources') or {}).get('metals') or {},['ok','stale','error','contract_match','checked_at_utc']))
          print('HUB_METALS',fields(b,['open_trades','pnl_gbp','live_positions_status','live_positions_error','combined_high_water_status','combined_high_water_error','high_water_gbp','giveback_gbp','live_xau_open_count','live_xag_short_open_count']))
          print('HUB_RISK',fields(m,['live_risk_ok','live_risk_error','live_risk_open_trade_count','live_risk_quantified_trade_count','live_risk_unquantified_trade_count','live_risk_by_instrument','live_stop_floor_coverage_status']))
          print('HUB_RISK_IDS',sig(m.get('live_risk_broker_trade_ids')))
          print('HUB_POS_IDS',sig((m.get('live_metals_positions') or {}).get('broker_trade_ids')))
          print('HUB_ACCT',fields(acc,['lane_reporting_status','xag_short_broker_net_verified','realised_scope','realised_week_gbp','realised_month_gbp','realised_all_time_gbp']))
          print('HUB_PORTFOLIO',fields(p,['live_stop_floor_scope_status','live_stop_floor_metals_position_count','live_stop_floor_metals_risk_count','live_stop_floor_metals_quantified_count','live_stop_floor_metals_exact_trade_ids','live_stop_floor_metals_instrument_coverage','live_stop_floor_coverage_warning']))
          for path in ['/api/live-metals-open-positions','/api/live-metals-open-pnl','/api/live-metals-lane-accounting','/api/portfolio-risk','/api/portfolio-summary','/dashboard/top']:
            d=ask(MET,path)
            if path.endswith('open-positions'):
              print('POS',fields(d,['ok','scope','xau_ok','xag_ok','count','xau_count','xag_count','xag_short_count','xag_broker_link_reconciled','xag_untracked_broker_count','practice_excluded','xag_unrealized_complete','xag_unrealized_gbp','observed_at_utc','error','reason']))
              print('POS_IDS',sig([x.get('broker_trade_id') for x in (d.get('trades') or []) if isinstance(x,dict)]))
              print('POS_STOP_FIELDS',{'trades':len(d.get('trades') or []),'without_stop_price':sum(x.get('stop_price') is None for x in (d.get('trades') or []) if isinstance(x,dict))})
            elif path.endswith('open-pnl'):
              print('HWM',fields(d,['ok','scope','status','high_water_status','open_pnl_gbp','high_water_gbp','giveback_gbp','open_count','xau_count','xag_short_count','observed_at_utc','high_water_at_utc','high_water_tracking_started_at_utc','error','reason']))
            elif path.endswith('lane-accounting'):
              print('LANE',fields(d,['ok','reconciled','reporting_status','time_utc','xag_short_net_gbp_verified','missing_reconciliation_requirements','error','xau_ledger_audit','xag_short_ledger_audit','coverage_warning','xag_short_verification_error']))
            elif path.endswith('portfolio-risk'):
              print('RISK',fields(d,['ok','open_trade_count','quantified_trade_count','unquantified_trade_count','by_instrument','capital_at_risk_gbp','locked_profit_floor_gbp','scope','error','observed_at_utc']))
              print('RISK_IDS',sig(d.get('broker_trade_ids')))
            elif path.endswith('portfolio-summary'):
              print('SUMMARY',fields(d,['status','mode','version','producer_time_utc']))
              print('SUMMARY_BASKET',fields(d.get('basket') or {},['open_trades','pnl_gbp','last_trade_opened_at_utc']))
              print('SUMMARY_ACCT',fields(d.get('accounting') or {},['realised_today_gbp','realised_week_gbp','realised_month_gbp','realised_all_time_gbp','realised_scope','xag_short_broker_net_verified']))
            else:
              print('TOP',fields(d,['status','ok','error','scope','version']))
          PY
